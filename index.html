<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>大軍記帳系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1729; --surface:#1A2438; --surface2:#141C2E;
    --ink:#E8E6E0; --muted:#6B7390; --line:#243150;
    --gold:#C9A961; --gold-ink:#3A2F0F;
    --green:#4ADE80; --green-ink:#0A2E1A;
    --red:#F87171; --red-ink:#3A0E0E;
    --yellow:#FBBF24;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Noto Sans TC', -apple-system, sans-serif;
    min-height:100vh; padding-bottom:40px;
  }
  .mono{font-family:'Roboto Mono', monospace;}
  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px; padding:20px;
  }
  #loginScreen h1{font-size:20px; font-weight:500; color:var(--gold);}
  #loginScreen input{
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    padding:14px 16px; border-radius:10px; font-size:16px; width:260px; text-align:center;
  }
  #loginScreen button{
    background:var(--gold); color:var(--gold-ink); border:none; border-radius:10px;
    padding:14px 16px; font-size:15px; font-weight:500; width:260px; cursor:pointer;
  }
  #loginError{color:var(--red); font-size:13px; min-height:18px;}

  #app{display:none; max-width:480px; margin:0 auto; padding:0 0 20px;}

  header{
    position:sticky; top:0; z-index:10; background:rgba(15,23,41,0.95); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); padding:14px 16px 0;
  }
  .tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:12px; -webkit-overflow-scrolling:touch;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    background:var(--surface); color:var(--muted); font-size:13px; font-weight:500;
    padding:8px 14px; border-radius:8px; white-space:nowrap; border:1px solid var(--line);
    cursor:pointer; flex-shrink:0;
  }
  .tab.active{background:var(--gold); color:var(--gold-ink); border-color:var(--gold);}

  .month-nav{
    display:flex; align-items:center; justify-content:center; gap:16px; padding:12px 16px;
  }
  .month-nav button{
    background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:4px 10px;
  }
  .month-nav span{font-size:14px; color:var(--ink);}

  main{padding:0 16px;}

  .balance-card{text-align:center; padding:20px 0 16px;}
  .balance-card .label{color:var(--muted); font-size:12px; margin-bottom:6px;}
  .balance-card .amount{font-size:34px; font-weight:500;}
  .balance-card .rows{display:flex; justify-content:center; gap:20px; margin-top:10px; font-size:12px;}
  .balance-card .rows .in{color:var(--green);}
  .balance-card .rows .out{color:var(--red);}

  .action-row{display:flex; gap:10px; margin-bottom:20px;}
  .action-row button{
    flex:1; border:none; border-radius:10px; padding:12px; font-size:14px; font-weight:500; cursor:pointer;
  }
  .btn-income{background:var(--green); color:var(--green-ink);}
  .btn-expense{background:var(--red); color:var(--red-ink);}

  .section-title{color:var(--muted); font-size:12px; margin-bottom:10px;}

  .record-list{background:var(--surface2); border-radius:12px; padding:4px 16px; margin-bottom:20px;}
  .record{
    display:flex; justify-content:space-between; align-items:center; padding:12px 0;
    border-bottom:1px solid var(--line); cursor:pointer;
  }
  .record:last-child{border-bottom:none;}
  .record .name{font-size:14px; color:var(--ink);}
  .record .meta{font-size:12px; color:var(--muted); margin-top:2px;}
  .record .amt.in{color:var(--green);}
  .record .amt.out{color:var(--red);}
  .empty-hint{color:var(--muted); font-size:13px; text-align:center; padding:24px 0;}

  .card{background:var(--surface2); border-radius:12px; padding:16px; margin-bottom:16px;}
  .card-title{font-size:14px; font-weight:500; margin-bottom:4px;}
  .card-sub{font-size:12px; color:var(--muted); margin-bottom:12px;}

  /* 財務健康頁 */
  .score-hero{text-align:center; padding:20px 0;}
  .score-num{font-size:56px; font-weight:600;}
  .score-light{display:inline-block; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:500; margin-top:6px;}
  .light-green{background:rgba(74,222,128,0.15); color:var(--green);}
  .light-yellow{background:rgba(251,191,36,0.15); color:var(--yellow);}
  .light-red{background:rgba(248,113,113,0.15); color:var(--red);}

  .sub-score-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line);}
  .sub-score-row:last-child{border-bottom:none;}
  .sub-score-row .name{font-size:13px; color:var(--ink);}
  .sub-score-row .bar-wrap{flex:1; height:6px; background:var(--line); border-radius:3px; margin:0 10px; overflow:hidden;}
  .sub-score-row .bar{height:100%; background:var(--gold); border-radius:3px;}
  .sub-score-row .val{font-size:13px; color:var(--muted); width:34px; text-align:right;}

  .suggestion{
    background:var(--surface2); border-left:3px solid var(--gold); border-radius:8px;
    padding:10px 12px; font-size:13px; color:var(--ink); margin-bottom:8px; line-height:1.5;
  }

  .ledger-badge{
    display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; background:var(--surface); color:var(--muted); margin-right:6px;
  }
  .warn-badge{background:rgba(248,113,113,0.15); color:var(--red);}

  /* 目標設定頁 */
  .goal-form{display:flex; flex-direction:column; gap:10px;}
  .goal-form label{font-size:12px; color:var(--muted);}
  .goal-form input, .goal-form select{
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    padding:10px 12px; border-radius:8px; font-size:14px; width:100%;
  }
  .goal-form button{
    background:var(--gold); color:var(--gold-ink); border:none; border-radius:8px;
    padding:12px; font-size:14px; font-weight:500; cursor:pointer; margin-top:4px;
  }
  .progress-wrap{height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:6px 0;}
  .progress-bar{height:100%; border-radius:4px;}
  .progress-bar.rev{background:var(--green);}
  .progress-bar.exp{background:var(--red);}
  .goal-row-label{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:2px;}

  /* Modal */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100;
    align-items:flex-end; justify-content:center;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--surface); width:100%; max-width:480px; border-radius:20px 20px 0 0;
    padding:20px; max-height:85vh; overflow-y:auto;
  }
  .modal h3{font-size:16px; margin-bottom:16px;}
  .modal label{font-size:12px; color:var(--muted); display:block; margin:12px 0 6px;}
  .modal input, .modal select{
    background:var(--surface2); border:1px solid var(--line); color:var(--ink);
    padding:12px; border-radius:8px; font-size:15px; width:100%;
  }
  .cat-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;}
  .cat-btn{
    background:var(--surface2); border:1px solid var(--line); color:var(--ink);
    padding:10px 6px; border-radius:8px; font-size:12px; text-align:center; cursor:pointer;
  }
  .cat-btn.selected{background:var(--gold); color:var(--gold-ink); border-color:var(--gold);}
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .modal-actions button{flex:1; padding:13px; border-radius:10px; border:none; font-size:14px; font-weight:500; cursor:pointer;}
  .btn-cancel{background:var(--surface2); color:var(--muted);}
  .btn-save{background:var(--gold); color:var(--gold-ink);}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    padding:10px 18px; border-radius:20px; font-size:13px; z-index:200; display:none;
  }
</style>
</head>
<body>

<div id="loginScreen">
  <h1>大軍記帳系統</h1>
  <input type="password" id="passwordInput" placeholder="請輸入密碼" autocomplete="off">
  <button onclick="doLogin()">登入</button>
  <div id="loginError"></div>
</div>

<div id="app">
  <header>
    <div class="tabs" id="tabBar"></div>
    <div class="month-nav" id="monthNav">
      <button onclick="changeMonth(-1)">‹</button>
      <span id="monthLabel" class="mono"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </header>

  <main>
    <div id="ledgerView"></div>
    <div id="overviewView" style="display:none;"></div>
    <div id="healthView" style="display:none;"></div>
    <div id="goalView" style="display:none;"></div>
  </main>
</div>

<div class="modal-overlay" id="recordModal">
  <div class="modal">
    <h3 id="modalTitle">新增收入</h3>
    <label>分類</label>
    <div class="cat-grid" id="catGrid"></div>
    <label>金額</label>
    <input type="number" id="amountInput" placeholder="0" inputmode="decimal">
    <label>項目說明</label>
    <input type="text" id="itemInput" placeholder="例如：維修 - 電池更換">
    <label>付款方式</label>
    <select id="paymentInput">
      <option value="現金">現金</option>
      <option value="轉帳">轉帳</option>
      <option value="信用卡">信用卡</option>
      <option value="其他">其他</option>
    </select>
    <label>備註（選填）</label>
    <input type="text" id="noteInput" placeholder="">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" onclick="submitRecord()">儲存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <h3>刪除這筆記錄？</h3>
    <p style="color:var(--muted); font-size:13px; margin-bottom:16px;" id="deleteTargetInfo"></p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeDeleteModal()">取消</button>
      <button class="btn-save" style="background:var(--red); color:var(--red-ink);" onclick="confirmDelete()">刪除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxqAZun1ul7_c-qG9VPIjUkGh8mISoUTp7PbJ6CZAbVdcV3rm5eqhSGwiOqAo9bqV1Iiw/exec';
const LEDGERS = ['個人', '迪特軍EV', '電商神助手', '課程教學'];

let state = {
  password: '',
  currentTab: LEDGERS[0],      // 帳本名 或 'overview' / 'health' / 'goal'
  currentMonth: monthString(new Date()),
  categories: {},
  records: [],
  pendingType: '收入',
  pendingCategory: '',
  deleteTarget: null
};

function monthString(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(yyyyMM){
  const [y,m] = yyyyMM.split('-');
  return y + '年' + parseInt(m) + '月';
}
function fmtMoney(n){
  return Math.round(n).toLocaleString('zh-TW');
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(()=>{ t.style.display='none'; }, 2200);
}

async function callApi(action, extraParams){
  const params = new URLSearchParams(Object.assign({ action: action, password: state.password }, extraParams || {}));
  const res = await fetch(API_URL + '?' + params.toString());
  return res.json();
}

// ===== 登入 =====
async function doLogin(){
  const pw = document.getElementById('passwordInput').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if(!pw){ errEl.textContent='請輸入密碼'; return; }
  try{
    const params = new URLSearchParams({ action:'verifyPassword', password: pw });
    const res = await fetch(API_URL + '?' + params.toString());
    const data = await res.json();
    if(data.success){
      state.password = pw;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      initTabs();
      switchTab(LEDGERS[0]);
    } else {
      errEl.textContent = '密碼錯誤';
    }
  }catch(e){
    errEl.textContent = '連線失敗，請檢查網路';
  }
}

// ===== Tabs =====
function initTabs(){
  const bar = document.getElementById('tabBar');
  bar.innerHTML = '';
  const items = LEDGERS.concat(['總覽', '財務健康', '目標設定']);
  items.forEach(name=>{
    const el = document.createElement('div');
    el.className = 'tab';
    el.textContent = name;
    el.onclick = ()=>switchTab(name);
    el.dataset.name = name;
    bar.appendChild(el);
  });
}

function switchTab(name){
  state.currentTab = name;
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.name === name);
  });
  document.getElementById('monthNav').style.display = 'flex';
  document.getElementById('ledgerView').style.display = 'none';
  document.getElementById('overviewView').style.display = 'none';
  document.getElementById('healthView').style.display = 'none';
  document.getElementById('goalView').style.display = 'none';
  document.getElementById('monthLabel').textContent = monthLabel(state.currentMonth);

  if(name === '總覽'){
    document.getElementById('overviewView').style.display = 'block';
    loadOverview();
  } else if(name === '財務健康'){
    document.getElementById('healthView').style.display = 'block';
    loadHealth();
  } else if(name === '目標設定'){
    document.getElementById('goalView').style.display = 'block';
    loadGoalView();
  } else {
    document.getElementById('ledgerView').style.display = 'block';
    loadLedger(name);
  }
}

function changeMonth(delta){
  const [y,m] = state.currentMonth.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  state.currentMonth = monthString(d);
  document.getElementById('monthLabel').textContent = monthLabel(state.currentMonth);
  switchTab(state.currentTab);
}

// ===== 帳本記帳畫面 =====
async function loadLedger(ledgerName){
  const view = document.getElementById('ledgerView');
  view.innerHTML = '<div class="empty-hint">載入中...</div>';

  const [summaryRes, recordsRes] = await Promise.all([
    callApi('getSummary', { ledger: ledgerName, month: state.currentMonth }),
    callApi('getRecords', { ledger: ledgerName, month: state.currentMonth })
  ]);

  if(!summaryRes.success || !recordsRes.success){
    view.innerHTML = '<div class="empty-hint">讀取失敗，請確認密碼或稍後再試</div>';
    return;
  }

  const s = summaryRes.summary[ledgerName];
  state.records = recordsRes.records;

  let html = '';
  html += '<div class="balance-card">';
  html += '<div class="label">本月結餘</div>';
  html += '<div class="amount mono">$ ' + fmtMoney(s.balance) + '</div>';
  html += '<div class="rows"><span class="in">收入 $' + fmtMoney(s.income) + '</span><span class="out">支出 $' + fmtMoney(s.expense) + '</span></div>';
  html += '</div>';
  html += '<div class="action-row">';
  html += '<button class="btn-income" onclick="openRecordModal(\''+ledgerName+'\',\'收入\')">+ 收入</button>';
  html += '<button class="btn-expense" onclick="openRecordModal(\''+ledgerName+'\',\'支出\')">− 支出</button>';
  html += '</div>';
  html += '<div class="section-title">本月記錄</div>';

  if(state.records.length === 0){
    html += '<div class="record-list"><div class="empty-hint">這個月還沒有記錄</div></div>';
  } else {
    html += '<div class="record-list">';
    state.records.forEach(r=>{
      const isIn = r.type === '收入';
      html += '<div class="record" onclick="openDeleteModal(\''+ledgerName+'\','+r.rowIndex+',\''+r.category+'\','+r.amount+')">';
      html += '<div><div class="name">'+r.category+(r.item?(' · '+r.item):'')+'</div><div class="meta">'+r.date+' · '+(r.paymentMethod||'')+'</div></div>';
      html += '<div class="amt mono '+(isIn?'in':'out')+'">'+(isIn?'+':'−')+fmtMoney(r.amount)+'</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  view.innerHTML = html;
  state.currentLedger = ledgerName;
}

// ===== 記帳 Modal =====
async function openRecordModal(ledgerName, type){
  state.pendingLedger = ledgerName;
  state.pendingType = type;
  document.getElementById('modalTitle').textContent = (type === '收入' ? '新增收入' : '新增支出') + '（' + ledgerName + '）';
  document.getElementById('amountInput').value = '';
  document.getElementById('itemInput').value = '';
  document.getElementById('noteInput').value = '';

  const catRes = await callApi('getCategories', { ledger: ledgerName });
  const cats = catRes.success ? catRes.categories[type] : [];
  const grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  state.pendingCategory = cats[0] || '';
  cats.forEach(c=>{
    const btn = document.createElement('div');
    btn.className = 'cat-btn' + (c === state.pendingCategory ? ' selected' : '');
    btn.textContent = c;
    btn.onclick = ()=>{
      state.pendingCategory = c;
      document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
    };
    grid.appendChild(btn);
  });

  document.getElementById('recordModal').classList.add('show');
}
function closeModal(){
  document.getElementById('recordModal').classList.remove('show');
}
async function submitRecord(){
  const amount = parseFloat(document.getElementById('amountInput').value);
  if(!amount || amount <= 0){ showToast('請輸入正確金額'); return; }
  const res = await callApi('addRecord', {
    ledger: state.pendingLedger,
    type: state.pendingType,
    category: state.pendingCategory,
    amount: amount,
    item: document.getElementById('itemInput').value,
    paymentMethod: document.getElementById('paymentInput').value,
    note: document.getElementById('noteInput').value
  });
  if(res.success){
    closeModal();
    showToast('已儲存');
    loadLedger(state.pendingLedger);
  } else {
    showToast('儲存失敗：' + (res.error||''));
  }
}

function openDeleteModal(ledgerName, rowIndex, category, amount){
  state.deleteTarget = { ledger: ledgerName, rowIndex: rowIndex };
  document.getElementById('deleteTargetInfo').textContent = category + '　$' + fmtMoney(amount);
  document.getElementById('deleteModal').classList.add('show');
}
function closeDeleteModal(){
  document.getElementById('deleteModal').classList.remove('show');
}
async function confirmDelete(){
  const t = state.deleteTarget;
  const res = await callApi('deleteRecord', { ledger: t.ledger, rowIndex: t.rowIndex });
  closeDeleteModal();
  if(res.success){
    showToast('已刪除');
    loadLedger(t.ledger);
  } else {
    showToast('刪除失敗');
  }
}

// ===== 總覽 =====
async function loadOverview(){
  const view = document.getElementById('overviewView');
  view.innerHTML = '<div class="empty-hint">載入中...</div>';
  const res = await callApi('getSummary', { ledger: 'all', month: state.currentMonth });
  if(!res.success){ view.innerHTML = '<div class="empty-hint">讀取失敗</div>'; return; }

  let html = '<div class="balance-card">';
  html += '<div class="label">全帳本本月結餘</div>';
  html += '<div class="amount mono" style="color:var(--gold);">$ ' + fmtMoney(res.grandTotal.balance) + '</div>';
  html += '<div class="rows"><span class="in">收入 $'+fmtMoney(res.grandTotal.income)+'</span><span class="out">支出 $'+fmtMoney(res.grandTotal.expense)+'</span></div>';
  html += '</div>';

  html += '<div class="section-title">各帳本明細</div>';
  LEDGERS.forEach(name=>{
    const s = res.summary[name];
    html += '<div class="card">';
    html += '<div class="card-title">'+name+'</div>';
    html += '<div class="rows" style="justify-content:flex-start; gap:16px; margin-top:6px;">';
    html += '<span class="in mono">+'+fmtMoney(s.income)+'</span><span class="out mono">−'+fmtMoney(s.expense)+'</span>';
    html += '<span class="mono" style="color:var(--muted);">結餘 '+fmtMoney(s.balance)+'</span>';
    html += '</div></div>';
  });

  view.innerHTML = html;
}

// ===== 財務健康 =====
async function loadHealth(){
  const view = document.getElementById('healthView');
  view.innerHTML = '<div class="empty-hint">計算中...</div>';
  const res = await callApi('getHealthScore', { month: state.currentMonth });
  if(!res.success){ view.innerHTML = '<div class="empty-hint">讀取失敗</div>'; return; }

  const lightClass = 'light-' + res.light;
  const lightLabel = res.light === 'green' ? '健康' : (res.light === 'yellow' ? '注意' : '警示');

  let html = '<div class="score-hero">';
  html += '<div class="score-num mono" style="color:var(--gold);">'+res.totalScore+'</div>';
  html += '<div class="score-light '+lightClass+'">'+lightLabel+'</div>';
  html += '</div>';

  html += '<div class="card">';
  html += '<div class="card-title">分項指標</div>';
  html += subScoreRow('儲蓄率', res.subScores.savingsRate.score, res.subScores.savingsRate.value + '%');
  html += subScoreRow('帳本結構', res.subScores.structure.score, res.subScores.structure.warnings.length ? res.subScores.structure.warnings.length+'個警示' : '無警示');
  const g = res.subScores.growth;
  const growthText = g.mom !== null ? ((g.mom>=0?'+':'')+g.mom+'%') : '無上月資料';
  html += subScoreRow('成長趨勢（月對月）', g.score, growthText);
  if(g.yoy !== null){
    html += '<div style="font-size:12px; color:var(--muted); margin:-4px 0 8px 0;">去年同期比：'+(g.yoy>=0?'+':'')+g.yoy+'%</div>';
  }
  const gp = res.subScores.goalProgress;
  html += subScoreRow('目標達成度', gp.score, gp.hasGoal ? '已設定目標' : '尚未設定目標');
  html += '</div>';

  if(res.subScores.structure.warnings.length > 0){
    html += '<div class="card"><div class="card-title" style="color:var(--red);">結構警示帳本</div>';
    res.subScores.structure.warnings.forEach(w=>{
      html += '<span class="ledger-badge warn-badge">'+w+'</span>';
    });
    html += '</div>';
  }

  html += '<div class="section-title">本月建議</div>';
  res.suggestions.forEach(s=>{
    html += '<div class="suggestion">'+s+'</div>';
  });

  view.innerHTML = html;
}
function subScoreRow(name, score, valText){
  return '<div class="sub-score-row">'
    + '<div class="name">'+name+'</div>'
    + '<div class="bar-wrap"><div class="bar" style="width:'+score+'%;"></div></div>'
    + '<div class="val mono">'+score+'</div>'
    + '</div>'
    + '<div style="font-size:11px; color:var(--muted); margin:-6px 0 8px 0; text-align:right;">'+valText+'</div>';
}

// ===== 目標設定 =====
async function loadGoalView(){
  const view = document.getElementById('goalView');
  view.innerHTML = '<div class="empty-hint">載入中...</div>';

  const [goalsRes, summaryRes] = await Promise.all([
    callApi('getGoals', { ledger:'all', month: state.currentMonth }),
    callApi('getSummary', { ledger:'all', month: state.currentMonth })
  ]);
  if(!goalsRes.success || !summaryRes.success){ view.innerHTML = '<div class="empty-hint">讀取失敗</div>'; return; }

  let html = '<div class="section-title">'+monthLabel(state.currentMonth)+' 各帳本目標進度</div>';

  LEDGERS.forEach(name=>{
    const goal = goalsRes.goals[name];
    const actual = summaryRes.summary[name];
    html += '<div class="card">';
    html += '<div class="card-title">'+name+'</div>';

    if(goal && goal.revenueGoal > 0){
      const pct = Math.min(100, Math.round(actual.income / goal.revenueGoal * 100));
      html += '<div class="goal-row-label"><span>營收目標 $'+fmtMoney(goal.revenueGoal)+'</span><span>'+pct+'%</span></div>';
      html += '<div class="progress-wrap"><div class="progress-bar rev" style="width:'+pct+'%;"></div></div>';
      html += '<div style="font-size:12px; color:var(--muted); margin-bottom:10px;">目前 $'+fmtMoney(actual.income)+'</div>';
    }
    if(goal && goal.expenseCap > 0){
      const pct2 = Math.min(100, Math.round(actual.expense / goal.expenseCap * 100));
      html += '<div class="goal-row-label"><span>支出上限 $'+fmtMoney(goal.expenseCap)+'</span><span>'+pct2+'%</span></div>';
      html += '<div class="progress-wrap"><div class="progress-bar exp" style="width:'+pct2+'%;"></div></div>';
      html += '<div style="font-size:12px; color:var(--muted);">目前 $'+fmtMoney(actual.expense)+'</div>';
    }
    if(!goal || (!goal.revenueGoal && !goal.expenseCap)){
      html += '<div class="card-sub">尚未設定目標</div>';
    }

    html += '<div class="goal-form" style="margin-top:12px;">';
    html += '<label>營收目標</label><input type="number" id="rev_'+name+'" placeholder="例如 100000" value="'+((goal&&goal.revenueGoal)||'')+'">';
    html += '<label>支出上限</label><input type="number" id="exp_'+name+'" placeholder="例如 50000" value="'+((goal&&goal.expenseCap)||'')+'">';
    html += '<button onclick="saveGoal(\''+name+'\')">儲存目標</button>';
    html += '</div>';

    html += '</div>';
  });

  view.innerHTML = html;
}
async function saveGoal(ledgerName){
  const rev = parseFloat(document.getElementById('rev_'+ledgerName).value) || 0;
  const exp = parseFloat(document.getElementById('exp_'+ledgerName).value) || 0;
  const res = await callApi('setGoal', { ledger: ledgerName, month: state.currentMonth, revenueGoal: rev, expenseCap: exp });
  if(res.success){
    showToast('目標已儲存');
    loadGoalView();
  } else {
    showToast('儲存失敗');
  }
}

// Enter 鍵登入
document.getElementById('passwordInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter') doLogin();
});
