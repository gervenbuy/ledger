<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172033">
<title>工作室財務健康 APP</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--good:#0f9d58;--warn:#d97706;--bad:#dc2626;--shadow:0 6px 22px rgba(15,23,42,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{max-width:1180px;margin:auto;padding:14px 14px calc(98px + env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.title{font-size:24px;font-weight:800}.subtitle{color:var(--muted);font-size:13px}.topActions{display:flex;gap:8px;align-items:center}.monthPick{padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.metric .label{font-size:13px;color:var(--muted)}.metric .value{font-size:28px;font-weight:800;margin-top:6px}.metric .hint{font-size:12px;color:var(--muted);margin-top:6px}.green{color:var(--good)}.yellow{color:var(--warn)}.red{color:var(--bad)}.section{margin-top:16px}.section h2{font-size:17px;margin:0 0 10px}.bizgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.biz .name{font-weight:800}.biz .nums{display:flex;justify-content:space-between;gap:8px;margin-top:9px;font-size:13px;color:var(--muted)}button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;min-height:44px}.primary{background:var(--accent);color:#fff}.ghost{background:#eef2ff;color:#1e3a8a}.danger{background:#fee2e2;color:#991b1b}.mutedBtn{background:#f3f4f6;color:#374151}.smallBtn{padding:7px 10px;min-height:36px;font-size:12px}.tabs{display:flex;gap:8px;margin-bottom:12px;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{background:#fff;border:1px solid var(--line);color:var(--text);white-space:nowrap}.tab.active{background:#172033;color:#fff}.page{display:none}.page.active{display:block}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;color:var(--muted)}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);min-height:46px}textarea{min-height:84px;resize:vertical}.full{grid-column:1/-1}.radioRow{display:flex;gap:8px}.radioBtn{flex:1;background:#f3f4f6}.radioBtn.active{background:#172033;color:#fff}.filterbar{display:grid;grid-template-columns:2fr repeat(3,1fr) auto;gap:8px;margin-bottom:10px}.filterbar input,.filterbar select{min-height:42px;padding:9px 10px}.tableWrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:#f8fafc;position:sticky;top:0;z-index:1}.plus{color:var(--good);font-weight:700}.minus{color:var(--bad);font-weight:700}.empty{padding:28px;text-align:center;color:var(--muted)}.actions{display:flex;gap:6px}.mobileLedger{display:none}.ledgerCard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}.ledgerTop{display:flex;justify-content:space-between;gap:10px}.ledgerAmount{font-weight:800;font-size:19px}.ledgerMeta{font-size:12px;color:var(--muted);margin-top:4px}.ledgerDesc{font-weight:700;margin-top:8px}.ledgerActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.ledgerActions button{width:100%}.settingsGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.notice{display:flex;align-items:center;justify-content:space-between;gap:12px}.notice strong{font-size:20px}.chartCard{padding-bottom:10px}.chart{width:100%;height:220px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:currentColor}.outList{display:grid;gap:8px}.outItem{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:9px 0}.outItem:last-child{border-bottom:0}.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:12px;background:#f3f4f6}.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;display:none;z-index:30;max-width:90%;text-align:center}.loading{opacity:.58;pointer-events:none}.modalBack{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}.modalBack.show{display:flex}.modal{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:16px;box-shadow:0 20px 70px rgba(0,0,0,.25)}.modalHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.modalHead h2{margin:0;font-size:19px}.modalFoot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.bizgrid{grid-template-columns:1fr 1fr}.settingsGrid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.title{font-size:20px}.topbar{align-items:flex-start;flex-direction:column}.topActions{width:100%}.monthPick{flex:1}.filterbar{grid-template-columns:1fr 1fr}.filterbar .wide{grid-column:1/-1}}
@media(max-width:600px){.app{padding:10px 10px calc(96px + env(safe-area-inset-bottom))}.grid{gap:8px}.card{padding:13px;border-radius:15px}.metric .value{font-size:22px}.bizgrid{grid-template-columns:1fr}.desktopLedger{display:none}.mobileLedger{display:block}.modalBack{padding:0;align-items:flex-end}.modal{width:100%;max-height:94vh;border-radius:20px 20px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.modalFoot{position:sticky;bottom:0;background:#fff;padding-top:10px}.title{font-size:19px}.filterbar{grid-template-columns:1fr}.filterbar .wide{grid-column:auto}.topActions{display:grid;grid-template-columns:1fr auto}.notice{align-items:flex-start;flex-direction:column}.chart{height:190px}}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px}
#loginScreen h1{font-size:20px;font-weight:800;color:var(--text)}
#loginScreen input{border:1px solid var(--line);border-radius:12px;padding:13px 16px;font-size:16px;width:260px;text-align:center}
#loginScreen button{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;width:260px;cursor:pointer}
#loginError{color:var(--bad);font-size:13px;min-height:18px}
</style>
</head>
<body>
<div id="loginScreen">
  <h1>工作室財務健康 APP</h1>
  <input type="password" id="passwordInput" placeholder="請輸入密碼" autocomplete="off">
  <button onclick="doLogin()">登入</button>
  <div id="loginError"></div>
</div>
<div class="app" id="app" style="display:none;">
  <div class="topbar">
    <div><div class="title">工作室財務健康 APP <span class="pill">V1.3</span></div><div class="subtitle" id="monthText">載入中...</div></div>
    <div class="topActions"><input id="monthPicker" class="monthPick" type="month" onchange="changeMonth()"><button class="ghost" onclick="refreshAll()">重新整理</button></div>
  </div>
  <div class="tabs"><button class="tab active" data-page="dashboard">儀表板</button><button class="tab" data-page="entry">快速記帳</button><button class="tab" data-page="ledger">帳本</button><button class="tab" data-page="receivables">未收未付</button><button class="tab" data-page="settings">設定</button></div>

  <section id="dashboard" class="page active">
    <div class="grid">
      <div class="card metric"><div class="label">本月營收</div><div class="value" id="mRevenue">$0</div></div>
      <div class="card metric"><div class="label">本月直接支出</div><div class="value" id="mExpense">$0</div></div>
      <div class="card metric"><div class="label">本月淨利</div><div class="value" id="mProfit">$0</div></div>
      <div class="card metric"><div class="label">固定成本</div><div class="value" id="mFixed">$0</div></div>
      <div class="card metric"><div class="label">工作室現金</div><div class="value" id="mCash">$0</div></div>
      <div class="card metric"><div class="label">損益兩平營收</div><div class="value" id="mBreakEven">$0</div></div>
      <div class="card metric"><div class="label">現金續航</div><div class="value" id="mRunway">0 月</div></div>
      <div class="card metric"><div class="label">財務健康</div><div class="value" id="mHealth">—</div></div>
    </div>
    <div class="section card notice"><div><div class="subtitle">應收未收</div><strong id="mReceivable">$0</strong><div class="subtitle" id="mOutstandingCount">0 筆待處理</div></div><button class="ghost" onclick="showPage('receivables')">查看未收未付</button></div>
    <div class="section card chartCard"><h2>近 6 個月營收趨勢</h2><div id="trendChart" class="chart"></div><div class="legend"><span class="green"><i class="dot"></i>營收</span><span class="red"><i class="dot"></i>支出</span></div></div>
    <div class="section"><h2>五大業務表現</h2><div class="bizgrid" id="bizGrid"></div></div>
  </section>

  <section id="entry" class="page"><div class="card"><h2 style="margin-top:0">新增一筆帳</h2><div class="formgrid">
    <div class="field full"><label>收入 / 支出</label><div class="radioRow"><button id="incomeBtn" type="button" class="radioBtn active" onclick="setType('收入')">收入</button><button id="expenseBtn" type="button" class="radioBtn" onclick="setType('支出')">支出</button></div></div>
    <div class="field"><label>日期</label><input id="date" type="date"></div><div class="field"><label>金額</label><input id="amount" type="number" inputmode="decimal" min="1"></div>
    <div class="field"><label>業務類型</label><select id="businessType" onchange="renderCategoryOptions()"></select></div><div class="field"><label>分類</label><select id="category"></select></div>
    <div class="field"><label>客戶</label><input id="customer"></div><div class="field"><label>說明</label><input id="description"></div>
    <div class="field"><label>帳戶</label><select id="account"></select></div><div class="field"><label>付款方式</label><select id="paymentMethod"><option>轉帳</option><option>現金</option><option>信用卡</option><option>其他</option></select></div>
    <div class="field"><label>付款狀態</label><select id="paymentStatus"><option>已收/付</option><option>未收/付</option></select></div><div class="field"><label>專案 ID</label><input id="projectId"></div>
    <div class="field full"><label>備註</label><textarea id="note"></textarea></div><div class="full"><button class="primary" style="width:100%" onclick="saveTransaction()">儲存這筆帳</button></div>
  </div></div></section>

  <section id="ledger" class="page">
    <div class="filterbar">
      <input class="wide" id="searchText" placeholder="搜尋客戶、說明、分類、專案 ID…" oninput="applyFilters()">
      <select id="filterBiz" onchange="applyFilters()"><option value="">全部業務</option></select>
      <select id="filterType" onchange="applyFilters()"><option value="">收入＋支出</option><option>收入</option><option>支出</option></select>
      <select id="filterStatus" onchange="applyFilters()"><option value="">全部狀態</option><option>已收/付</option><option>未收/付</option></select>
      <button class="mutedBtn" onclick="clearFilters()">清除</button>
    </div>
    <div class="subtitle" id="filterSummary" style="margin:0 0 8px"></div>
    <div class="desktopLedger tableWrap"><table><thead><tr><th>日期</th><th>業務</th><th>分類</th><th>客戶 / 說明</th><th>狀態</th><th>收支</th><th>金額</th><th>帳戶</th><th>操作</th></tr></thead><tbody id="ledgerBody"></tbody></table></div>
    <div class="mobileLedger" id="mobileLedger"></div>
  </section>

  <section id="receivables" class="page">
    <div class="grid" style="grid-template-columns:repeat(2,1fr)"><div class="card metric"><div class="label">應收未收</div><div class="value green" id="rReceivable">$0</div></div><div class="card metric"><div class="label">應付未付</div><div class="value red" id="rPayable">$0</div></div></div>
    <div class="section card"><h2>待處理明細</h2><div id="outstandingList" class="outList"></div></div>
  </section>

  <section id="settings" class="page"><div class="settingsGrid">
    <div class="card"><h2 style="margin-top:0">財務設定</h2><div class="field"><label>目前工作室可動用現金</label><input id="cashBalance" type="number"></div><div class="field" style="margin-top:10px"><label>老闆月薪目標</label><input id="ownerSalary" type="number"></div><button class="primary" style="margin-top:12px;width:100%" onclick="saveSettings()">儲存設定</button></div>
    <div class="card"><h2 style="margin-top:0">固定成本</h2><div id="fixedList" class="subtitle"></div></div>
    <div class="card"><h2 style="margin-top:0">新增固定成本</h2><div class="field"><label>項目</label><input id="fixedItem"></div><div class="field" style="margin-top:8px"><label>每月金額</label><input id="fixedAmount" type="number"></div><div class="field" style="margin-top:8px"><label>分類</label><input id="fixedCategory" value="其他"></div><button class="primary" style="margin-top:12px;width:100%" onclick="addFixedCost()">新增固定成本</button></div>
  </div></section>
</div>

<div class="modalBack" id="editModal"><div class="modal"><div class="modalHead"><h2>修改帳目</h2><button class="mutedBtn" onclick="closeEdit()">關閉</button></div><div class="formgrid">
  <div class="field full"><label>收入 / 支出</label><div class="radioRow"><button id="eIncomeBtn" type="button" class="radioBtn" onclick="setEditType('收入')">收入</button><button id="eExpenseBtn" type="button" class="radioBtn" onclick="setEditType('支出')">支出</button></div></div>
  <div class="field"><label>日期</label><input id="eDate" type="date"></div><div class="field"><label>金額</label><input id="eAmount" type="number" inputmode="decimal"></div>
  <div class="field"><label>業務類型</label><select id="eBusinessType" onchange="renderEditCategoryOptions()"></select></div><div class="field"><label>分類</label><select id="eCategory"></select></div>
  <div class="field"><label>客戶</label><input id="eCustomer"></div><div class="field"><label>說明</label><input id="eDescription"></div>
  <div class="field"><label>帳戶</label><select id="eAccount"></select></div><div class="field"><label>付款方式</label><select id="ePaymentMethod"><option>轉帳</option><option>現金</option><option>信用卡</option><option>其他</option></select></div>
  <div class="field"><label>付款狀態</label><select id="ePaymentStatus"><option>已收/付</option><option>未收/付</option></select></div><div class="field"><label>專案 ID</label><input id="eProjectId"></div>
  <div class="field full"><label>備註</label><textarea id="eNote"></textarea></div>
</div><div class="modalFoot"><button class="mutedBtn" onclick="closeEdit()">取消</button><button class="primary" onclick="saveEdit()">儲存修改</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id), money=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW',{maximumFractionDigits:0});
const API_URL = 'https://script.google.com/macros/s/AKfycbxqAZun1ul7_c-qG9VPIjUkGh8mISoUTp7PbJ6CZAbVdcV3rm5eqhSGwiOqAo9bqV1Iiw/exec';
const state={password:'',month:'',type:'收入',editType:'收入',editingId:null,businessTypes:[],categories:[],accounts:[],fixedCosts:[],dashboard:{},transactions:[],trend:[],outstanding:{count:0,receivable:0,payable:0,items:[]},filtered:[]};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function todayLocal(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function init(){ $('date').value=todayLocal(); $('monthPicker').value=todayLocal().slice(0,7); state.month=$('monthPicker').value; document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page))); refreshAll(); }

async function doLogin(){
  const pw = $('passwordInput').value;
  const errEl = $('loginError');
  errEl.textContent = '';
  if(!pw){ errEl.textContent='請輸入密碼'; return; }
  try{
    const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action:'verifyPassword', password: pw }) });
    const data = await res.json();
    if(data.success){
      state.password = pw;
      $('loginScreen').style.display = 'none';
      $('app').style.display = 'block';
      init();
    } else {
      errEl.textContent = '密碼錯誤';
    }
  }catch(e){
    errEl.textContent = '連線失敗，請檢查網路';
  }
}
$('passwordInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

function callServer(method,...args){
  return new Promise(async (resolve,reject)=>{
    const methods=['getBootstrapData','addTransaction','updateTransaction','deleteTransaction','saveSettings','addFixedCost'];
    if(!methods.includes(method)) return reject(new Error('未知方法'));
    let body = { action: method, password: state.password };
    if(method==='getBootstrapData'){ body.month = args[0]; }
    else if(method==='addTransaction'){ body.data = args[0]; }
    else if(method==='updateTransaction'){ body.data = args[0]; }
    else if(method==='deleteTransaction'){ body.data = { id: args[0] }; body.month = args[1]; }
    else if(method==='saveSettings'){ body.data = args[0]; body.month = args[1]; }
    else if(method==='addFixedCost'){ body.data = args[0]; body.month = args[1]; }
    try{
      const res = await fetch(API_URL, { method:'POST', body: JSON.stringify(body), cache:'no-store' });
      const json = await res.json();
      if(!json.success) return reject(new Error(json.error || '發生錯誤'));
      resolve(json);
    }catch(e){ reject(e); }
  });
}
function setLoading(on){$('app').classList.toggle('loading',on)} function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===id));window.scrollTo({top:0,behavior:'smooth'});}
async function refreshAll(){try{setLoading(true);const data=await callServer('getBootstrapData',state.month);Object.assign(state,data);$('monthPicker').value=state.month;hydrateSelectors();renderAll();}catch(e){alert(e.message)}finally{setLoading(false)}}
function changeMonth(){state.month=$('monthPicker').value||todayLocal().slice(0,7);refreshAll()}
function hydrateSelectors(){const bizOpts=state.businessTypes.map(x=>`<option>${esc(x)}</option>`).join(''), accts=state.accounts.map(x=>`<option>${esc(x.name)}</option>`).join('');$('businessType').innerHTML=bizOpts;$('account').innerHTML=accts;$('eBusinessType').innerHTML=bizOpts;$('eAccount').innerHTML=accts;$('filterBiz').innerHTML='<option value="">全部業務</option>'+bizOpts;renderCategoryOptions();}
function setType(t){state.type=t;$('incomeBtn').classList.toggle('active',t==='收入');$('expenseBtn').classList.toggle('active',t==='支出');renderCategoryOptions()}
function renderCategoryOptions(){const biz=$('businessType').value,list=state.categories.filter(x=>x.type===state.type&&(x.businessType===biz||x.businessType==='工作室共用'));$('category').innerHTML=(list.length?list:[{name:'其他'}]).map(x=>`<option>${esc(x.name)}</option>`).join('')}
function setEditType(t){state.editType=t;$('eIncomeBtn').classList.toggle('active',t==='收入');$('eExpenseBtn').classList.toggle('active',t==='支出');renderEditCategoryOptions()}
function renderEditCategoryOptions(selected){const biz=$('eBusinessType').value,list=state.categories.filter(x=>x.type===state.editType&&(x.businessType===biz||x.businessType==='工作室共用'));$('eCategory').innerHTML=(list.length?list:[{name:'其他'}]).map(x=>`<option>${esc(x.name)}</option>`).join('');if(selected)$('eCategory').value=selected}
function renderAll(){renderDashboard();applyFilters();renderFixedCosts();renderOutstanding();renderTrend()}
function renderDashboard(){const d=state.dashboard||{},o=state.outstanding||{};$('monthText').textContent=(d.month||'')+' 財務概況';$('mRevenue').textContent=money(d.revenue);$('mExpense').textContent=money(d.expenses);$('mProfit').textContent=money(d.netProfit);$('mFixed').textContent=money(d.fixedCosts);$('mCash').textContent=money(d.cashBalance);$('mBreakEven').textContent=money(d.breakevenRevenue);$('mRunway').textContent=Number(d.runwayMonths||0).toFixed(1)+' 月';$('mHealth').textContent=d.health||'—';$('mHealth').className='value '+(d.health==='綠燈'?'green':d.health==='黃燈'?'yellow':'red');$('mReceivable').textContent=money(o.receivable);$('mOutstandingCount').textContent=(o.count||0)+' 筆待處理';$('ownerSalary').value=d.ownerSalary||0;$('cashBalance').value=d.cashBalance||0;const entries=Object.entries(d.byBusiness||{}).filter(([k])=>k!=='工作室共用');$('bizGrid').innerHTML=entries.map(([k,b])=>`<div class="card biz"><div class="name">${esc(k)}</div><div class="nums"><span>營收 ${money(b.revenue)}</span><span>支出 ${money(b.expense)}</span></div><div class="nums"><strong>損益 ${money(b.profit)}</strong><span>毛利率 ${Number(b.margin||0).toFixed(1)}%</span></div></div>`).join('')}
function applyFilters(){const q=($('searchText')?.value||'').trim().toLowerCase(),biz=$('filterBiz')?.value||'',type=$('filterType')?.value||'',status=$('filterStatus')?.value||'';let rows=(state.transactions||[]).filter(x=>(!biz||x.businessType===biz)&&(!type||x.type===type)&&(!status||x.paymentStatus===status));if(q)rows=rows.filter(x=>[x.customer,x.description,x.category,x.projectId,x.note,x.account].some(v=>String(v||'').toLowerCase().includes(q)));state.filtered=rows;renderLedger(rows);if($('filterSummary'))$('filterSummary').textContent=`顯示 ${rows.length} / ${(state.transactions||[]).length} 筆`;}
function clearFilters(){['searchText','filterBiz','filterType','filterStatus'].forEach(id=>{if($(id))$(id).value=''});applyFilters()}
function renderLedger(rows){rows=rows||state.transactions||[];$('ledgerBody').innerHTML=rows.length?rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.businessType)}</td><td>${esc(x.category)}</td><td>${esc(x.customer||x.description||'-')}</td><td>${esc(x.paymentStatus||'-')}</td><td>${esc(x.type)}</td><td class="${x.type==='收入'?'plus':'minus'}">${x.type==='收入'?'+':'-'}${money(x.amount)}</td><td>${esc(x.account||'-')}</td><td><div class="actions"><button class="ghost smallBtn" onclick="openEdit('${x.id}')">修改</button><button class="danger smallBtn" onclick="removeTransaction('${x.id}')">刪除</button></div></td></tr>`).join(''):`<tr><td colspan="9" class="empty">沒有符合條件的帳目。</td></tr>`;$('mobileLedger').innerHTML=rows.length?rows.map(x=>`<div class="ledgerCard"><div class="ledgerTop"><div><div><strong>${esc(x.businessType)}</strong> · ${esc(x.category)}</div><div class="ledgerMeta">${esc(x.date)} · ${esc(x.account||'-')} · ${esc(x.paymentStatus||'-')}</div></div><div class="ledgerAmount ${x.type==='收入'?'plus':'minus'}">${x.type==='收入'?'+':'-'}${money(x.amount)}</div></div><div class="ledgerDesc">${esc(x.customer||x.description||'未填說明')}</div><div class="ledgerMeta">${esc(x.description&&x.customer?x.description:'')} ${x.projectId?`· 專案 ${esc(x.projectId)}`:''}</div><div class="ledgerActions"><button class="ghost" onclick="openEdit('${x.id}')">✏️ 修改</button><button class="danger" onclick="removeTransaction('${x.id}')">🗑️ 刪除</button></div></div>`).join(''):`<div class="card empty">沒有符合條件的帳目。</div>`}
function renderOutstanding(){const o=state.outstanding||{items:[]};$('rReceivable').textContent=money(o.receivable);$('rPayable').textContent=money(o.payable);$('outstandingList').innerHTML=(o.items||[]).length?o.items.map(x=>`<div class="outItem"><div><strong>${esc(x.customer||x.description||x.category)}</strong><div class="subtitle">${esc(x.date)} · ${esc(x.businessType)} · ${esc(x.category)}</div></div><div style="text-align:right"><div class="${x.type==='收入'?'plus':'minus'}">${x.type==='收入'?'+':'-'}${money(x.amount)}</div><button class="ghost smallBtn" style="margin-top:5px" onclick="openEdit('${x.id}')">修改狀態</button></div></div>`).join(''):'<div class="empty">目前沒有未收／未付帳目。</div>'}
function renderTrend(){const data=state.trend||[],el=$('trendChart');if(!data.length){el.innerHTML='<div class="empty">還沒有趨勢資料</div>';return}const W=700,H=200,pad=28,max=Math.max(1,...data.flatMap(d=>[d.revenue,d.expense]));const step=(W-pad*2)/Math.max(1,data.length-1),y=v=>H-pad-(v/max)*(H-pad*2);const pts=(key)=>data.map((d,i)=>`${pad+i*step},${y(d[key])}`).join(' ');const labels=data.map((d,i)=>`<text x="${pad+i*step}" y="194" text-anchor="middle" font-size="11" fill="#6b7280">${d.month.slice(5)}</text>`).join('');el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" role="img" aria-label="近六個月營收支出趨勢"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#e5e7eb"/><polyline fill="none" stroke="#0f9d58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="${pts('revenue')}"/><polyline fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${pts('expense')}"/>${data.map((d,i)=>`<circle cx="${pad+i*step}" cy="${y(d.revenue)}" r="4" fill="#0f9d58"><title>${d.month} 營收 ${money(d.revenue)}</title></circle><circle cx="${pad+i*step}" cy="${y(d.expense)}" r="3.5" fill="#dc2626"><title>${d.month} 支出 ${money(d.expense)}</title></circle>`).join('')}${labels}</svg>`}
function renderFixedCosts(){const list=state.fixedCosts||[];$('fixedList').innerHTML=list.map(x=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><span>${esc(x.item)}</span><strong>${money(x.amount)}</strong></div>`).join('')+`<div style="display:flex;justify-content:space-between;padding-top:10px"><span>合計</span><strong>${money(list.reduce((s,x)=>s+x.amount,0))}</strong></div>`}
function formData(prefix='',type=state.type,id=''){const g=n=>$(prefix+n);return{id,date:g('Date')?g('Date').value:$('date').value,type,businessType:g('BusinessType')?g('BusinessType').value:$('businessType').value,category:g('Category')?g('Category').value:$('category').value,customer:g('Customer')?g('Customer').value:$('customer').value,description:g('Description')?g('Description').value:$('description').value,amount:Number(g('Amount')?g('Amount').value:$('amount').value),account:g('Account')?g('Account').value:$('account').value,paymentMethod:g('PaymentMethod')?g('PaymentMethod').value:$('paymentMethod').value,paymentStatus:g('PaymentStatus')?g('PaymentStatus').value:$('paymentStatus').value,projectId:g('ProjectId')?g('ProjectId').value:$('projectId').value,note:g('Note')?g('Note').value:$('note').value}}
function applyPayload(res){if(res.dashboard)state.dashboard=res.dashboard;if(res.transactions)state.transactions=res.transactions;if(res.trend)state.trend=res.trend;if(res.outstanding)state.outstanding=res.outstanding;if(res.fixedCosts)state.fixedCosts=res.fixedCosts;renderAll()}
async function saveTransaction(){const d=formData();if(!d.date||!d.amount){toast('請填日期與金額');return}try{setLoading(true);const res=await callServer('addTransaction',d);state.month=d.date.slice(0,7);$('monthPicker').value=state.month;applyPayload(res);['amount','customer','description','projectId','note'].forEach(id=>$(id).value='');toast('已儲存');showPage('ledger')}catch(e){alert(e.message)}finally{setLoading(false)}}
function openEdit(id){const x=state.transactions.find(t=>t.id===id)||((state.outstanding||{}).items||[]).find(t=>t.id===id);if(!x)return;state.editingId=id;$('eDate').value=x.date;$('eAmount').value=x.amount;$('eBusinessType').value=x.businessType;$('eCustomer').value=x.customer||'';$('eDescription').value=x.description||'';$('eAccount').value=x.account||'';$('ePaymentMethod').value=x.paymentMethod||'轉帳';$('ePaymentStatus').value=x.paymentStatus||'已收/付';$('eProjectId').value=x.projectId||'';$('eNote').value=x.note||'';setEditType(x.type);renderEditCategoryOptions(x.category);$('editModal').classList.add('show');document.body.style.overflow='hidden'}
function closeEdit(){$('editModal').classList.remove('show');document.body.style.overflow='';state.editingId=null}
async function saveEdit(){const d=formData('e',state.editType,state.editingId);if(!d.date||!d.amount){toast('請填日期與金額');return}try{setLoading(true);const res=await callServer('updateTransaction',d);state.month=d.date.slice(0,7);$('monthPicker').value=state.month;closeEdit();applyPayload(res);toast('修改完成')}catch(e){alert(e.message)}finally{setLoading(false)}}
async function removeTransaction(id){const x=state.transactions.find(t=>t.id===id);if(!x)return;const text=`確定刪除這筆帳目？\n${x.date}｜${x.businessType}｜${x.category}\n${x.type} ${money(x.amount)}`;if(!confirm(text))return;try{setLoading(true);const res=await callServer('deleteTransaction',id,state.month);applyPayload(res);toast('已刪除')}catch(e){alert(e.message)}finally{setLoading(false)}}
async function saveSettings(){try{setLoading(true);const res=await callServer('saveSettings',{CASH_BALANCE:Number($('cashBalance').value||0),OWNER_SALARY_TARGET:Number($('ownerSalary').value||0)},state.month);applyPayload(res);toast('設定已儲存')}catch(e){alert(e.message)}finally{setLoading(false)}}
async function addFixedCost(){const d={item:$('fixedItem').value,amount:Number($('fixedAmount').value),category:$('fixedCategory').value};if(!d.item||!d.amount){toast('請填項目與金額');return}try{setLoading(true);const res=await callServer('addFixedCost',d,state.month);applyPayload(res);$('fixedItem').value='';$('fixedAmount').value='';toast('固定成本已新增')}catch(e){alert(e.message)}finally{setLoading(false)}}
$('editModal').addEventListener('click',e=>{if(e.target===$('editModal'))closeEdit()});
</script>
</body></html>
